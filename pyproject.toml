[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oraclelens"
version = "0.1.0"
description = "Oracle Database terminal explorer and analyzer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OracleLens Team" }]
license = { text = "MIT" }
keywords = ["oracle", "database", "cli", "explorer", "analytics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "rich>=13.7.0",
  "prompt-toolkit>=3.0.0",
  "python-dotenv>=1.0.0",
  "python-oracledb>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "build>=1.0.0",
]

[project.scripts]
oraclelens = "oraclelens.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
